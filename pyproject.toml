[project]
name = "cbb-quant-model"
version = "2.0.0"
description = "College Basketball Spread Prediction Model"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "brotli",
    "requests",
    "pytz",
    "streamlit",
    "altair",
    "cryptography>=46.0.3",
    "python-dotenv>=1.2.1",
    "scipy>=1.10",
    "httpx>=0.24",
    "geopy>=2.4.1",
    "python-telegram-bot[job-queue]>=21.0",
    "ocrmac>=1.0.0",
    "streamlit-autorefresh>=1.0.1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.2"]

[project.scripts]
train = "model:train_and_evaluate"
train-win = "model_win:train_win_models"
predict = "predict:main"
features = "features:main"
